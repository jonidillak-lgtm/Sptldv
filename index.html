<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model SPTLDV - Sistem Pertidaksamaan Linear Dua Variabel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 1.5em;
            color: #333;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 0.95em;
        }

        input[type="number"],
        input[type="text"],
        select {
            padding: 10px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 0.95em;
            transition: all 0.3s;
        }

        input[type="number"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .equation-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .equation-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 8px;
            align-items: end;
        }

        .equation-inputs > input {
            padding: 8px;
            font-size: 0.9em;
        }

        .operator-select {
            display: flex;
            gap: 5px;
        }

        .operator-select select {
            width: 100%;
            padding: 8px;
            font-size: 0.9em;
        }

        .equation-number {
            font-weight: 700;
            color: #667eea;
            font-size: 1.1em;
            min-width: 30px;
        }

        .equation-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .test-point-section {
            background: #f0f4ff;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
        }

        .test-point-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .constraint-section {
            background: #fff3cd;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #ffc107;
        }

        .constraint-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .constraint-row {
            display: flex;
            align-items: end;
            gap: 8px;
        }

        .constraint-row > input {
            flex: 1;
            padding: 8px;
            font-size: 0.9em;
        }

        .constraint-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #555;
            font-size: 0.9em;
            white-space: nowrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
            width: 100%;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .graph-container {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }

        canvas {
            max-width: 100%;
            height: auto;
        }

        .result-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 2px solid #ddd;
            margin-top: 20px;
        }

        .result-title {
            font-size: 1.2em;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .result-item {
            padding: 10px;
            background: white;
            border-radius: 5px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }

        .result-value {
            font-family: 'Courier New', monospace;
            color: #667eea;
            font-weight: 600;
        }

        .test-result {
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            font-weight: 600;
        }

        .test-result.valid {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .test-result.invalid {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .delete-btn-container {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
        }

        .color-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .flex-row {
            display: flex;
            align-items: end;
            gap: 10px;
        }

        .flex-row > div {
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 Model SPTLDV</h1>
            <p>Sistem Pertidaksamaan Linear Dua Variabel - Interactive Visualization</p>
        </div>

        <div class="content">
            <!-- Left Side: Input Controls -->
            <div class="section">
                <h2 class="section-title">⚙️ Input Pertidaksamaan</h2>

                <div id="equationsContainer">
                    <!-- Equations will be added here dynamically -->
                </div>

                <button class="btn-primary btn-success" onclick="addEquation()">+ Tambah Persamaan</button>

                <div class="constraint-section">
                    <h3 class="section-title">📋 Batasan Variabel</h3>
                    <div class="constraint-grid">
                        <div class="constraint-row">
                            <span class="constraint-label">x ≥</span>
                            <input type="number" id="minX" value="0" step="0.1">
                        </div>
                        <div class="constraint-row">
                            <span class="constraint-label">y ≥</span>
                            <input type="number" id="minY" value="0" step="0.1">
                        </div>
                    </div>
                </div>

                <div class="test-point-section">
                    <h3 class="section-title">🔍 Titik Uji</h3>
                    <p style="font-size: 0.9em; color: #666; margin-bottom: 10px;">Masukkan koordinat untuk menguji apakah titik memenuhi semua pertidaksamaan</p>
                    <div class="test-point-inputs">
                        <div class="form-group">
                            <label>x =</label>
                            <input type="number" id="testX" value="2" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>y =</label>
                            <input type="number" id="testY" value="2" step="0.1">
                        </div>
                    </div>
                    <button class="btn-primary" style="width: 100%;" onclick="testPoint()">Test Titik</button>
                    <div id="testResult"></div>
                </div>

                <button class="btn-secondary" style="width: 100%; margin-top: 20px;" onclick="drawGraph()">🎨 Update Grafik</button>
            </div>

            <!-- Right Side: Graph -->
            <div class="section">
                <h2 class="section-title">📊 Visualisasi Grafik</h2>
                <div class="graph-container">
                    <canvas id="graphCanvas" width="500" height="500"></canvas>
                </div>
                <div class="result-section" id="resultSection" style="display: none;">
                    <div class="result-title">📍 Hasil Uji Titik</div>
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
